name: Deploy to GitHub Pages (live-signals.com)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-audit --no-fund
      # Static export without changing Rocket's own next.config.mjs in the repo
      - name: Enable static export
        run: |
          mv next.config.mjs next.config.base.mjs
          cat > next.config.mjs <<'CFG'
          import base from './next.config.base.mjs';
          export default { ...base, output: 'export', images: { ...base.images, unoptimized: true } };
          CFG
      - run: npx next build
        env:
          NEXT_PUBLIC_SITE_URL: https://live-signals.com
      - run: |
          echo "live-signals.com" > out/CNAME
          touch out/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
